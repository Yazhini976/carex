# ==============================================================================
# CAREX Production Configuration Profile (application-prod.properties)
# ==============================================================================

spring.application.name=carex-backend

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:carex}
spring.datasource.username=${DB_USERNAME:carex}
spring.datasource.password=${DB_PASSWORD:carex}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

server.port=${PORT:8080}

# Production Security & Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.mail.enabled=false

# CORS Configuration - Allow Vercel and local origins
carex.cors.allowed-origin-patterns=*

# Production Email & Rate Limiting
carex.email.enabled=${CAREX_EMAIL_ENABLED:true}
carex.email.from=${MAIL_FROM:noreply@carex.app}
carex.email.max-retries=3
carex.reminder.minutes-before=30
carex.reminder.scheduler.enabled=${CAREX_REMINDER_SCHEDULER_ENABLED:true}

# CAREX AI / Groq LLM Configuration
carex.ai.llm.enabled=true
carex.ai.llm.api-key=${GROQ_API_KEY:}
carex.ai.llm.base-url=https://api.groq.com/openai/v1
carex.ai.llm.model=llama-3.3-70b-versatile
carex.ai.llm.timeout-ms=5000
