spring.application.name=carex-backend

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:carex}
spring.datasource.username=${DB_USERNAME:carex}
spring.datasource.password=${DB_PASSWORD:carex}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:8080}

# Spring Actuator Management
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.mail.enabled=false

# JWT Configuration
jwt.secret=${JWT_SECRET:carexSecretKeyMustBeAtLeast256BitsLongForHMACSHA256Security1234567890}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Mail Configuration
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# CAREX Notification Engine Configuration
carex.email.enabled=${CAREX_EMAIL_ENABLED:false}
carex.email.from=${MAIL_FROM:noreply@carex.com}
carex.reminder.minutes-before=30
carex.reminder.scheduler.enabled=${CAREX_REMINDER_SCHEDULER_ENABLED:true}

# Seed Data & Automatic PostgreSQL Database Seeding
carex.seed-data.enabled=${CAREX_SEED_DATA_ENABLED:true}

# CAREX AI / Groq LLM Configuration
carex.ai.llm.enabled=true
carex.ai.llm.api-key=${GROQ_API_KEY:}
carex.ai.llm.base-url=https://api.groq.com/openai/v1
carex.ai.llm.model=llama-3.3-70b-versatile
carex.ai.llm.timeout-ms=5000
